services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: peafowl-server

    ports:
      - "3000:3000"

    env_file:
      - ./server/.env

    depends_on:
      - redis

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: peafowl-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

volumes:
  redis_data: